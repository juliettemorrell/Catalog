[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repo-catalog"
version = "0.1.0"
description = "Scan every repository in a GitHub org and build two catalogs: a general repo catalog and an AI asset library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
mcp = ["mcp>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
repo-catalog = "repo_catalog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_catalog"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/repo_catalog/analyzers/rules.py" = ["E501"]  # knowledge-base tables read best unwrapped
